# Render Blueprint: FastAPI API + Next.js web + Postgres.
# Dashboard → New → Blueprint → pick this repo. Values marked `sync: false` are prompted for on first deploy.

envVarGroups:
  - name: xotiictech-shared
    envVars:
      - key: PROXY_SHARED_SECRET # lets the Next.js /api proxy relay visitor IPs to the API
        generateValue: true

databases:
  - name: xotiictech-db
    databaseName: xotiictech
    user: xotiictech
    plan: basic-256mb
    ipAllowList: [] # private network only

services:
  # ---------------------------------------------------------------- FastAPI
  - type: web
    name: xotiictech-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    # Single worker on purpose: the APScheduler bot sync and the in-memory rate limiter live in-process.
    # (The sync is also guarded by a Postgres advisory lock, so scaling out stays safe.)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*' --workers 1
    healthCheckPath: /api/health
    envVars:
      - fromGroup: xotiictech-shared
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: xotiictech-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_URL
        value: https://xotiictech.com
      - key: CORS_ORIGINS
        value: https://www.xotiictech.com
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # --- admin (generate with: python -m app.scripts.create_admin) ---
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: ADMIN_IP_ALLOWLIST
        sync: false
      # --- stripe ---
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      # --- storage (Cloudflare R2) ---
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BUCKET
        value: xotiictech-media
      - key: S3_PRIVATE_BUCKET
        value: xotiictech-deliverables
      - key: S3_PUBLIC_BASE_URL
        sync: false
      # --- email (Resend) ---
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: XotiicTech <noreply@xotiictech.com>
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      # --- discord: one bot token per bot, comma-separated ---
      - key: DISCORD_BOT_TOKENS
        sync: false

  # ---------------------------------------------------------------- Next.js
  - type: web
    name: xotiictech-web
    runtime: node
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    domains:
      - xotiictech.com
      - www.xotiictech.com
    envVars:
      - fromGroup: xotiictech-shared
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://xotiictech.com
      # The API's private-network host:port, so server-side fetches and the /api proxy never leave Render.
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: xotiictech-api
          property: hostport
